name: 功能建议
description: 想要新能力，或者觉得某处设计可以更好
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚：这个项目的定位是**轻量、只做 Steam 与 GitHub 两件事**。
        如果建议的方向是"再加一堆功能"，大概率会被婉拒 —— 那类需求更适合成熟的全能工具箱。
        但如果是"把现有两件事做得更稳 / 更安全 / 更省资源"，非常欢迎。

        安全相关的建议请走 [SECURITY.md](https://github.com/Adler862/LocalBoost/blob/main/SECURITY.md) 的渠道。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的场景
      description: 描述问题和场景，不要直接跳到实现方案
      placeholder: |
        我在公司网络里，DoH 只有走代理才能出站，于是……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做
      description: 有具体方案就写，没有也行
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在你用什么办法绕过这个问题？别的同类工具是怎么做的？
    validations:
      required: false

  - type: dropdown
    id: system-impact
    attributes:
      label: 这个改动会不会需要动系统设置
      description: 需要新写入 hosts / 证书库 / 注册表，或新增对外网络请求，都需要额外论证
      options:
        - 不需要，纯粹是程序内部逻辑
        - 需要新增一处系统改动
        - 需要新增对外网络请求
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我知道这个项目会拒掉"往全功能工具箱扩"的方向
          required: false
